name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify crates.io package
        run: cargo package --manifest-path miniexcel/Cargo.toml --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-wasm
      - name: Install wasm-bindgen CLI
        run: cargo +stable install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        working-directory: web-demo
        run: npm ci
      - name: Build browser demo
        working-directory: web-demo
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web-demo
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web-demo
        run: npm run test:e2e

  dotnet-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          path: dotnet-source
      - name: Use this revision's parity contract
        run: |
          mkdir -p dotnet-source/tests/data/contracts
          cp tests/data/contracts/xlsx-parity-v1.json dotnet-source/tests/data/contracts/xlsx-parity-v1.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run shared XLSX parity contract
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~RustParityContractTests"
          --verbosity minimal

  named-table-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: named-table-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust named-table tests
        run: cargo +1.85.0 test -p miniexcel --test query_table --locked
      - name: Run MiniExcel .NET named-table tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~MiniExcelOpenXmlTableTests"
          --verbosity minimal

  comments-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: comments-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust comments tests
        run: cargo +1.85.0 test -p miniexcel --test comments --locked
      - name: Run MiniExcel .NET comments tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~CommentsRetrievalTests"
          --verbosity minimal

  csv-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: csv-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust CSV tests
        run: cargo +1.85.0 test -p miniexcel --test csv --locked
      - name: Run MiniExcel .NET CSV baseline tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.Csv.Tests/MiniExcel.Csv.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~MiniExcelCsvTests"
          --verbosity minimal

  async-query-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: async-query-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust async query tests
        run: cargo +1.85.0 test -p miniexcel --test query_async --features async --locked
      - name: Run MiniExcel .NET async query baseline tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~MiniExcelOpenXmlImporterAsyncTests"
          --verbosity minimal

  alter-sheet-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: alter-sheet-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust worksheet metadata tests
        run: |
          cargo +1.85.0 test -p miniexcel --test rename_sheet --locked
          cargo +1.85.0 test -p miniexcel --test sheet_visibility --locked
          cargo +1.85.0 test -p miniexcel --test reorder_sheet --locked
      - name: Run MiniExcel .NET AlterSheet baseline tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~MiniExcelAlterSheetTests|FullyQualifiedName~MiniExcelAlterSheetsTestAsync"
          --verbosity minimal

  copy-and-add-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
          path: dotnet-source
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: copy-and-add-parity-${{ matrix.os }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Rust copy-and-add tests
        run: cargo +1.85.0 test -p miniexcel --test copy_and_add_sheet --locked
      - name: Run MiniExcel .NET copy-and-add baseline tests
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~MiniExcelOpenXmlExporterTests.CopyAndInsertSheetTest|FullyQualifiedName~MiniExcelOpenXmlExporterAsyncTests.CopyAndInsertSheetTest"
          --verbosity minimal

  async-export-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          ref: b9a76d7af62142e0e38545b6905b01a06e8d160e
