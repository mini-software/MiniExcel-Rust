name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify crates.io package
        run: cargo package --manifest-path miniexcel/Cargo.toml --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --locked

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-wasm
      - name: Install wasm-bindgen CLI
        run: cargo +stable install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        working-directory: web-demo
        run: npm ci
      - name: Build browser demo
        working-directory: web-demo
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web-demo
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web-demo
        run: npm run test:e2e

  dotnet-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MiniExcel .NET
        uses: actions/checkout@v4
        with:
          repository: mini-software/MiniExcel
          path: dotnet-source
      - name: Use this revision's parity contract
        run: |
          mkdir -p dotnet-source/tests/data/contracts
          cp tests/data/contracts/xlsx-parity-v1.json dotnet-source/tests/data/contracts/xlsx-parity-v1.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run shared XLSX parity contract
        run: >-
          dotnet test dotnet-source/tests/MiniExcel.OpenXml.Tests/MiniExcel.OpenXml.Tests.csproj
          --framework net10.0
          --filter "FullyQualifiedName~RustParityContractTests"
          --verbosity minimal

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --locked