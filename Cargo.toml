[workspace]
members = ["miniexcel", "miniexcel-cli", "miniexcel-wasm"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mini-software/MiniExcel-Rust"
homepage = "https://github.com/mini-software/MiniExcel-Rust"

[workspace.dependencies]
atomicwrites = "0.4.4"
async-channel = "2.5.0"
calamine = { version = "0.35.0", features = ["chrono"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
console_error_panic_hook = "0.1.7"
csv = "1.4.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.8"
event-listener = "5.4.1"
fs2 = "0.4.3"
futures-core = "0.3.31"
futures-executor = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "async-await-macro", "std"] }
indexmap = { version = "2.12.1", features = ["serde"] }
quick-xml = "0.39.4"
rust_xlsxwriter = { version = "0.96.0", features = ["chrono", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
same-file = "1.0.6"
tempfile = "3.23.0"
thiserror = "2.0.17"
uuid = "1.18.1"
wasm-bindgen = "0.2.127"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"