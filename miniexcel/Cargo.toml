[package]
name = "miniexcel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Streaming XLSX reader and writer for Rust"
readme = "../README.md"
documentation = "https://docs.rs/miniexcel"
keywords = ["excel", "xlsx", "spreadsheet", "serde", "streaming"]
categories = ["parser-implementations"]

[features]
default = []
async = ["dep:async-channel", "dep:event-listener", "dep:futures-core", "dep:futures-util"]

[dependencies]
calamine.workspace = true
chrono.workspace = true
indexmap.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-channel = { workspace = true, optional = true }
event-listener = { workspace = true, optional = true }
fs2.workspace = true
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, features = ["constant_memory"] }
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter.workspace = true

[target.'cfg(windows)'.dependencies]
atomicwrites.workspace = true

[dev-dependencies]
futures-executor.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true